name: gastos-ocr

# Los puertos se publican solo en 127.0.0.1: las credenciales son de desarrollo.
x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gastos}:${POSTGRES_PASSWORD:-gastos_local}@postgres:5432/${POSTGRES_DB:-gastos}
  S3_ENDPOINT_URL: http://s3:9000
  S3_BUCKET: ${S3_BUCKET:-gastos-tickets-local}
  AWS_REGION: ${AWS_REGION:-us-east-2}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gastos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastos_local}
      POSTGRES_DB: ${POSTGRES_DB:-gastos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3-init:
    image: gastos-ocr-api:dev
    build: ./api
    command: ["python", "-m", "app.init_storage"]
    environment: *api-environment
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  api:
    image: gastos-ocr-api:dev
    build: ./api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/srv/app"]
    environment: *api-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api/app:/srv/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  s3-data:
