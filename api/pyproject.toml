[project]
name = "gastos-api"
version = "0.1.0"
description = "API del gestor de gastos con OCR de tickets"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.124",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.124",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]
