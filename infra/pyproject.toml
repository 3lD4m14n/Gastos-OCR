[project]
name = "gastos-infra"
version = "0.1.0"
description = "Infraestructura del gestor de gastos con AWS CDK"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.275.0",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app.py", "stacks"]
